metadata:
  name: qps615-interface-validation
  format: "Lava-Test Test Definition 1.0"
  description: "Inspect QPS615 EFI FIT selection and validate runtime device-tree and PCIe topology, conditional pwrctrl-tc9563 binding, TC956x firmware and driver readiness, and dynamically discovered Ethernet interfaces without changing target state."
  os:
    - linux
  scope:
    - functional

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Connectivity/Ethernet/QPS615_Interface_Validation
    - ./run.sh || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh QPS615_Interface_Validation.res || true
