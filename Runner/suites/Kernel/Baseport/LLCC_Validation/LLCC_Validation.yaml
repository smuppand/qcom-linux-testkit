metadata:
  name: LLCC_Validation
  format: "Lava-Test Test Definition 1.0"
  description: "Validate Qualcomm Last Level Cache Controller applicability, binding, and kernel health"
  os:
    - linux
  scope:
    - functional

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/LLCC_Validation
    - ./run.sh || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh LLCC_Validation.res
