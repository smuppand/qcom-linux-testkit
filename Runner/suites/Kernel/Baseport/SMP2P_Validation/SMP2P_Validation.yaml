metadata:
  name: SMP2P_Validation
  format: "Lava-Test Test Definition 1.0"
  description: "Validate Qualcomm SMP2P device-tree, driver binding, and kernel health"
  os:
    - linux
  scope:
    - functional

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/SMP2P_Validation
    - ./run.sh || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh SMP2P_Validation.res
